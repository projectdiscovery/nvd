name: 🔨 Build Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test Builds
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: projectdiscovery/actions/setup/go@v1

      - name: Test
        run: |
            mkdir tmp;
            go test;
        env: 
          NVD_API_KEY: "${{ secrets.NVD_API_KEY }}"
